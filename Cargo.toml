[workspace]
resolver = "3"
members = ["crates/aria-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
aria-core = { path = "crates/aria-core" }

tauri = { version = "2" }
tauri-build = { version = "2" }
tauri-plugin-dialog = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "stream", "json", "charset"] }
ignore = "0.4"
regex = "1"
globset = "0.4"
sha2 = "0.10"
tempfile = "3"
futures-util = { version = "0.3", default-features = false }
url = "2"
glob = "0.3"
keyring = { version = "4" }
